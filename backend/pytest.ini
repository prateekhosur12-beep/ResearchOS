[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -q --strict-markers
markers =
    live: exercises real external services (OpenAlex / Crossref / arXiv / Ollama). Skipped unless RUN_LIVE_TESTS=1.
    slow: takes longer than a second or two
filterwarnings =
    ignore::DeprecationWarning
